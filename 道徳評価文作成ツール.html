<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>道徳評価文作成ツール</title>
<style>
  :root{
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface-2: #f6f3ec;
    --border: #e6e1d4;
    --text: #2a2822;
    --text-dim: #7d7869;
    --accent: #2f5d62;
    --accent-soft: #e3edec;
    --accent-strong: #1c3d40;
    --accent-contrast: #ffffff;
    --ok: #3f7d5c;
    --ok-bg: #eaf3ee;
    --warn: #a6602a;
    --warn-bg: #fbf0e4;
    --danger: #b3462c;
    --shadow: 0 1px 2px rgba(30,32,24,.04), 0 10px 28px rgba(30,32,24,.06);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #17181a;
      --surface: #211f1c;
      --surface-2: #262421;
      --border: #38352e;
      --text: #ece9e2;
      --text-dim: #a39d8d;
      --accent: #7fbdb9;
      --accent-soft: #203635;
      --accent-strong: #b6ded9;
      --accent-contrast: #0e1f20;
      --ok: #7fc79f;
      --ok-bg: #223327;
      --warn: #e0a869;
      --warn-bg: #362a1c;
      --danger: #e1876a;
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.35);
    }
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.7;
    padding: 48px 20px 90px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 860px; margin: 0 auto; }

  header.page{ margin-bottom: 26px; }
  .eyebrow{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--accent-strong);
    margin-bottom: 10px;
  }
  .eyebrow svg{ width: 13px; height: 13px; flex: 0 0 auto; }
  header.page h1{
    font-size: 25px;
    font-weight: 700;
    letter-spacing: .02em;
    margin: 0 0 8px;
    color: var(--text);
  }
  header.page p{
    margin: 0;
    color: var(--text-dim);
    font-size: 13.5px;
    max-width: 56ch;
  }

  .privacy-note{
    display:flex;
    gap:10px;
    align-items:flex-start;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 16px;
    margin: 20px 0 28px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .privacy-note svg{
    flex: 0 0 auto;
    width: 15px; height: 15px;
    margin-top: 2px;
    color: var(--accent-strong);
  }

  .tabs{
    display: inline-flex;
    gap: 2px;
    padding: 4px;
    margin-bottom: 24px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .tab-btn{
    appearance: none;
    border: none;
    background: transparent;
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-dim);
    padding: 9px 18px;
    cursor: pointer;
    border-radius: 999px;
    transition: background .15s ease, color .15s ease;
  }
  .tab-btn.active{
    color: var(--accent-contrast);
    background: var(--accent);
  }

  .panel{ display: none; }
  .panel.active{ display: block; }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }

  .card-top{
    display:flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .card-index{
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .card-index .num{
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-contrast);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
  }
  .icon-btn{
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    border-radius: 8px;
    font-size: 12px;
    padding: 5px 11px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{ background: var(--border); color: var(--text); }
  .icon-btn.danger:hover{ color: var(--danger); border-color: var(--danger); background: transparent; }

  .field-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 14px;
    margin-bottom: 6px;
  }
  .field{
    display:flex;
    flex-direction: column;
    gap: 5px;
  }
  .field.span2{ grid-column: 1 / -1; }
  .field label{
    font-size: 11.5px;
    color: var(--text-dim);
    font-weight: 600;
    letter-spacing: .02em;
  }
  select, input[type="text"]{
    font: inherit;
    font-size: 13.5px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 11px;
    width: 100%;
    appearance: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  select:focus, input[type="text"]:focus{
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .custom-input{ margin-top: 6px; }
  select{
    background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 28px;
  }

  .output{
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding: 14px 16px;
    margin-top: 14px;
  }
  .output + .output{ margin-top: 10px; }
  .output-label{
    display:flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
  }
  .output-label span.name{
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-strong);
    letter-spacing: .03em;
  }
  .output-text{
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 15.5px;
    line-height: 1.9;
    min-height: 1.9em;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .output-text.empty{
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
  }
  .output-meta{
    display:flex;
    gap: 10px;
    align-items: center;
    margin-top: 9px;
    font-size: 11.5px;
  }
  .count{ color: var(--text-dim); }
  .badge{
    display:inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 11px;
  }
  .badge.ok{ background: var(--ok-bg); color: var(--ok); }
  .badge.warn{ background: var(--warn-bg); color: var(--warn); }
  .copy-btn{
    margin-left: auto;
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    border-radius: 8px;
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .copy-btn:hover{ border-color: var(--accent); color: var(--accent-strong); }
  .copy-btn.copied{ color: var(--ok); border-color: var(--ok); }

  .add-row{
    width: 100%;
    appearance: none;
    border: 1.5px dashed var(--border);
    background: transparent;
    color: var(--text-dim);
    border-radius: var(--radius);
    padding: 15px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    transition: border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .add-row:hover{ border-color: var(--accent); color: var(--accent-strong); }
  .add-row:active{ transform: scale(.997); }

  footer.page{
    margin-top: 44px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer.page .saved{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-dim);
  }
  footer.page .saved::before{
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ok);
  }
  .clear-btn{
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-dim);
    padding: 6px 4px;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: transparent;
    transition: color .15s ease, text-decoration-color .15s ease;
  }
  .clear-btn:hover{ color: var(--danger); text-decoration-color: var(--danger); }

  @media (max-width: 520px){
    .field-grid{ grid-template-columns: 1fr; }
    body{ padding: 32px 14px 70px; }
    .card{ padding: 18px 16px; }
  }
</style>
</head>

<div class="wrap">

  <header class="page">
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M12 2c-3 0-5 2-5 5s2 4 5 4 5-2 5-4-2-5-5-5Z"/><path d="M12 12v10M8 22h8"/></svg>
      道徳科 評価文サポート
    </div>
    <h1>道徳評価文作成ツール</h1>
    <p>①学習状況・②道徳的価値・③道徳性に係る成長の様子を組み合わせて、通知票・指導要録の文章を自動生成します。</p>
  </header>

  <div class="privacy-note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <div>
      このページはインターネットに送信されず、すべてこの端末・このブラウザの中だけで動作します。入力内容は自動的にこのブラウザ内(localStorage)にのみ保存されます。氏名・エピソードなど個人情報を扱うため、他の端末やクラウド、メールへの転送・共有は行わないでください。
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="term">1・2学期用</button>
    <button class="tab-btn" data-tab="year">学年末所見・指導要録用</button>
  </div>

  <section id="panel-term" class="panel active">
    <div id="term-list"></div>
    <button class="add-row" id="term-add">＋ 児童を追加</button>
  </section>

  <section id="panel-year" class="panel">
    <div id="year-list"></div>
    <button class="add-row" id="year-add">＋ 児童を追加</button>
  </section>

  <footer class="page">
    <span class="saved" id="saved-indicator">保存済み</span>
    <button class="clear-btn" id="clear-all">すべてのデータを消去</button>
  </footer>

</div>

  function patternIndex(seed, mod){
    var h = 0;
    for(var i=0;i<seed.length;i++){ h = (h * 31 + seed.charCodeAt(i)) >>> 0; }
    return h % mod;
  }

  var STORE_KEY = "doutoku-hyouka-tool-v1";

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return null;
  }

  var saved = loadState();
  var state = {
    term: (saved && saved.term && saved.term.length) ? saved.term : [ emptyTermRow() ],
    year: (saved && saved.year && saved.year.length) ? saved.year : [ emptyYearRow() ]
  };

  function emptyTermRow(){
    return { id: uid(), name: "", grade: "", material: "", contentItem: "", i1: "", i2: "", i3: "", memo: "" };
  }
  function emptyYearRow(){
    return { id: uid(), name: "", contentItem: "", i1: "", i2: "", i3: "" };
  }

  function persist(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }catch(e){}
  }

  function selectOptions(list, current, placeholder){
    var html = '<option value="">' + placeholder + '</option>';
    for(var i=0;i<list.length;i++){
      var v = list[i];
      var sel = (v === current) ? " selected" : "";
      html += '<option value="' + escapeAttr(v) + '"' + sel + '>' + escapeHtml(v) + '</option>';
    }
    var customSel = (current === CUSTOM_VALUE) ? " selected" : "";
    html += '<option value="' + CUSTOM_VALUE + '"' + customSel + '>' + CUSTOM_LABEL + '</option>';
    return html;
  }

  // ①②の値は敬体・常体で形が変わらないためそのまま1つの自由入力欄でよいが、
  // ③は文末表現(敬体/常体)が変わるため、常体が必要な学年末パネルでは
  // 自由入力も敬体・常体の2欄をそれぞれ入力してもらう。
  function resolveSimple(row, field){
    return row[field] === CUSTOM_VALUE ? (row[field + "Custom"] || "") : (row[field] || "");
  }

  function resolveI3(row, group){
    if(row.i3 === CUSTOM_VALUE){
      return {
        keitai: row.i3CustomKeitai || "",
        jotai: group === "year" ? (row.i3CustomJotai || "") : ""
      };
    }
    var item = findItem3(row.i3);
    return item || { keitai: "", jotai: "" };
  }

  function selectFieldBlock(label, field, list, row, group){
    var html = '<div class="field span2"><label>' + label + '</label><select data-field="' + field + '" data-id="' + row.id + '" data-group="' + group + '">' + selectOptions(list, row[field], "選択してください") + '</select>';
    if(row[field] === CUSTOM_VALUE){
      var customField = field + "Custom";
      html += '<input type="text" class="custom-input" data-field="' + customField + '" data-id="' + row.id + '" data-group="' + group + '" value="' + escapeAttr(row[customField] || "") + '" placeholder="自由に入力してください">';
    }
    html += '</div>';
    return html;
  }

  function gradeFieldBlock(row, group){
    var opts = '<option value="">選択してください</option>';
    for(var g=1; g<=6; g++){
      var v = String(g);
      opts += '<option value="' + v + '"' + (row.grade === v ? " selected" : "") + '>' + v + '年</option>';
    }
    return '<div class="field"><label>学年</label><select data-field="grade" data-id="' + row.id + '" data-group="' + group + '">' + opts + '</select></div>';
  }

  function materialFieldBlock(row, group){
    var materials = MATERIALS[row.grade] || [];
    var names = materials.map(function(m){ return m.name; });
    var placeholder = names.length ? "選択してください" : "教材名(先に学年を選ぶと一覧から選べます)";
    var html = '<div class="field span2"><label>教材名</label><select data-field="material" data-id="' + row.id + '" data-group="' + group + '">' + selectOptions(names, row.material, placeholder) + '</select>';
    if(row.material === CUSTOM_VALUE){
      html += '<input type="text" class="custom-input" data-field="materialCustom" data-id="' + row.id + '" data-group="' + group + '" value="' + escapeAttr(row.materialCustom || "") + '" placeholder="教材名を入力してください">';
    }
    html += '</div>';
    return html;
  }

  function i3FieldBlock(row, group){
    var html = '<div class="field span2"><label>③成長の様子</label><select data-field="i3" data-id="' + row.id + '" data-group="' + group + '">' + selectOptions(ITEM3.map(function(x){return x.keitai;}), row.i3, "選択してください") + '</select>';
    if(row.i3 === CUSTOM_VALUE){
      html += '<input type="text" class="custom-input" data-field="i3CustomKeitai" data-id="' + row.id + '" data-group="' + group + '" value="' + escapeAttr(row.i3CustomKeitai || "") + '" placeholder="敬体(です・ます調)で入力">';
      if(group === "year"){
        html += '<input type="text" class="custom-input" data-field="i3CustomJotai" data-id="' + row.id + '" data-group="' + group + '" value="' + escapeAttr(row.i3CustomJotai || "") + '" placeholder="常体(だ・である調)で入力(指導要録用)">';
      }
    }
    html += '</div>';
    return html;
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function escapeAttr(s){
    return escapeHtml(s).replace(/"/g,"&quot;");
  }

  function findItem3(value){
    for(var i=0;i<ITEM3.length;i++){
      if(ITEM3[i].keitai === value) return ITEM3[i];
    }
    return null;
  }

  function judge(len){
    if(len === 0) return null;
    if(len < 60 || len > 100) return { cls: "warn", label: "要確認(60〜100字目安)" };
    return { cls: "ok", label: "文字数OK" };
  }

  // ---- 1・2学期 ----

  function renderTermList(){
    var wrap = document.getElementById("term-list");
    wrap.innerHTML = "";
    state.term.forEach(function(row, idx){
      wrap.appendChild(buildTermCard(row, idx));
    });
  }

  function termSentence(row){
    var i1 = resolveSimple(row, "i1");
    var i2 = resolveSimple(row, "i2");
    var i3 = resolveI3(row, "term");
    var material = resolveSimple(row, "material");
    var sentence = "";
    if(material){
      var introIdx = patternIndex(row.id, INTRO_TEMPLATES.length);
      sentence += INTRO_TEMPLATES[introIdx](material);
    }
    sentence += i1 + i2 + i3.keitai;
    if(row.memo){
      var memoIdx = patternIndex(row.id + "m", MEMO_TEMPLATES.length);
      sentence += MEMO_TEMPLATES[memoIdx](row.memo);
    }
    return sentence;
  }

  function buildTermCard(row, idx){
    var card = document.createElement("div");
    card.className = "card";

    var sentence = termSentence(row);
    var len = sentence.length;
    var j = judge(len);

    card.innerHTML =
      '<div class="card-top">' +
        '<span class="card-index"><span class="num">' + (idx+1) + '</span>児童</span>' +
        '<button class="icon-btn danger" data-act="del-term" data-id="' + row.id + '">削除</button>' +
      '</div>' +
      '<div class="field-grid">' +
        '<div class="field"><label>氏名(任意・手元でのみ使用)</label><input type="text" data-field="name" data-id="' + row.id + '" data-group="term" value="' + escapeAttr(row.name) + '" placeholder="例: 記号や仮名でも可"></div>' +
        gradeFieldBlock(row, "term") +
        materialFieldBlock(row, "term") +
        selectFieldBlock("内容項目", "contentItem", CONTENT_ITEMS, row, "term") +
        selectFieldBlock("①学習状況", "i1", ITEM1, row, "term") +
        selectFieldBlock("②道徳的価値", "i2", ITEM2, row, "term") +
        i3FieldBlock(row, "term") +
        '<div class="field span2"><label>エピソード・メモ(任意)</label><input type="text" data-field="memo" data-id="' + row.id + '" data-group="term" value="' + escapeAttr(row.memo) + '" placeholder="例: 友だちに声をかける姿"></div>' +
      '</div>' +
      '<div class="output">' +
        '<div class="output-label"><span class="name">生成文(敬体・通知票用)</span><button class="copy-btn" data-copy="term-' + row.id + '">コピー</button></div>' +
        '<div class="output-text' + (sentence ? '' : ' empty') + '" id="text-term-' + row.id + '">' + (sentence ? escapeHtml(sentence) : "①〜③を選択すると文章が表示されます") + '</div>' +
        '<div class="output-meta" id="meta-term-' + row.id + '"><span class="count">' + len + '字</span>' + (j ? '<span class="badge ' + j.cls + '">' + j.label + '</span>' : '') + '</div>' +
      '</div>';

    return card;
  }

  function updateTermOutput(row){
    var textEl = document.getElementById("text-term-" + row.id);
    var metaEl = document.getElementById("meta-term-" + row.id);
    if(!textEl || !metaEl) return;
    var sentence = termSentence(row);
    var len = sentence.length;
    var j = judge(len);
    textEl.textContent = sentence || "①〜③を選択すると文章が表示されます";
    textEl.classList.toggle("empty", !sentence);
    metaEl.innerHTML = '<span class="count">' + len + '字</span>' + (j ? '<span class="badge ' + j.cls + '">' + j.label + '</span>' : '');
  }

  // ---- 学年末所見・指導要録 ----

  function renderYearList(){
    var wrap = document.getElementById("year-list");
    wrap.innerHTML = "";
    state.year.forEach(function(row, idx){
      wrap.appendChild(buildYearCard(row, idx));
    });
  }

  function yearSentences(row){
    var i1 = resolveSimple(row, "i1");
    var i2 = resolveSimple(row, "i2");
    var i3 = resolveI3(row, "year");
    var keitai = i1 + i2 + i3.keitai;
    var jotai = i3.jotai ? (i1 + i2 + i3.jotai) : "";
    return { keitai: keitai, jotai: jotai };
  }

  function buildYearCard(row, idx){
    var card = document.createElement("div");
    card.className = "card";

    var sent = yearSentences(row);
    var lenK = sent.keitai.length;
    var j = judge(lenK);

    card.innerHTML =
      '<div class="card-top">' +
        '<span class="card-index"><span class="num">' + (idx+1) + '</span>児童</span>' +
        '<button class="icon-btn danger" data-act="del-year" data-id="' + row.id + '">削除</button>' +
      '</div>' +
      '<div class="field-grid">' +
        '<div class="field span2"><label>氏名(任意・手元でのみ使用)</label><input type="text" data-field="name" data-id="' + row.id + '" data-group="year" value="' + escapeAttr(row.name) + '" placeholder="例: 記号や仮名でも可"></div>' +
        selectFieldBlock("内容項目", "contentItem", CONTENT_ITEMS, row, "year") +
        selectFieldBlock("①学習状況", "i1", ITEM1, row, "year") +
        selectFieldBlock("②道徳的価値", "i2", ITEM2, row, "year") +
        i3FieldBlock(row, "year") +
      '</div>' +
      '<div class="output">' +
        '<div class="output-label"><span class="name">通知票用(学年末所見・敬体)</span><button class="copy-btn" data-copy="yeark-' + row.id + '">コピー</button></div>' +
        '<div class="output-text' + (sent.keitai ? '' : ' empty') + '" id="text-yeark-' + row.id + '">' + (sent.keitai ? escapeHtml(sent.keitai) : "①〜③を選択すると文章が表示されます") + '</div>' +
        '<div class="output-meta" id="meta-yeark-' + row.id + '"><span class="count">' + lenK + '字</span>' + (j ? '<span class="badge ' + j.cls + '">' + j.label + '</span>' : '') + '</div>' +
      '</div>' +
      '<div class="output">' +
        '<div class="output-label"><span class="name">指導要録用(常体)</span><button class="copy-btn" data-copy="yearj-' + row.id + '">コピー</button></div>' +
        '<div class="output-text' + (sent.jotai ? '' : ' empty') + '" id="text-yearj-' + row.id + '">' + (sent.jotai ? escapeHtml(sent.jotai) : "③を選択すると文章が表示されます") + '</div>' +
        '<div class="output-meta" id="meta-yearj-' + row.id + '"><span class="count">' + sent.jotai.length + '字</span></div>' +
      '</div>';

    return card;
  }

  function updateYearOutput(row){
    var textK = document.getElementById("text-yeark-" + row.id);
    var metaK = document.getElementById("meta-yeark-" + row.id);
    var textJ = document.getElementById("text-yearj-" + row.id);
    var metaJ = document.getElementById("meta-yearj-" + row.id);
    if(!textK || !metaK || !textJ || !metaJ) return;
    var sent = yearSentences(row);
    var lenK = sent.keitai.length;
    var j = judge(lenK);
    textK.textContent = sent.keitai || "①〜③を選択すると文章が表示されます";
    textK.classList.toggle("empty", !sent.keitai);
    metaK.innerHTML = '<span class="count">' + lenK + '字</span>' + (j ? '<span class="badge ' + j.cls + '">' + j.label + '</span>' : '');
    textJ.textContent = sent.jotai || "③を選択すると文章が表示されます";
    textJ.classList.toggle("empty", !sent.jotai);
    metaJ.innerHTML = '<span class="count">' + sent.jotai.length + '字</span>';
  }

  function renderAll(){
    renderTermList();
    renderYearList();
  }

  // ---- イベント処理(入力の委譲) ----
  // 入力・選択のたびにカード全体を作り直すと、入力中のテキストボックスからフォーカスが
  // 外れてしまう(1文字打つごとにカーソルが飛ぶ)ため、状態更新後は生成文と文字数の
  // 表示だけをピンポイントで更新する。フォームの再構築は行追加・削除・初期表示のみで行う。

  document.addEventListener("input", function(e){
    var t = e.target;
    var group = t.getAttribute("data-group");
    if(!group) return;
    var id = t.getAttribute("data-id");
    var field = t.getAttribute("data-field");
    var list = state[group];
    var row = null;
    for(var i=0;i<list.length;i++){
      if(list[i].id === id){
        list[i][field] = t.value;
        row = list[i];
        break;
      }
    }
    if(!row) return;

    if(field === "grade"){
      // 学年が変わると教材の選択肢が入れ替わるため、学年に紐づく
      // 教材名・内容項目の選択状態はリセットする。
      row.material = "";
      row.materialCustom = "";
      row.contentItem = "";
      row.contentItemCustom = "";
    } else if(field === "material" && t.value !== CUSTOM_VALUE && t.value !== ""){
      var materials = MATERIALS[row.grade] || [];
      for(var k=0;k<materials.length;k++){
        if(materials[k].name === t.value){ row.contentItem = materials[k].content; break; }
      }
    }

    if(t.tagName === "SELECT"){
      // セレクトの変更(自由入力への切り替えを含む)は入力中の連打ではないため、
      // フォーカス喪失を気にせずカード全体を再構築して自由入力欄の表示を反映する。
      if(group === "term") renderTermList(); else renderYearList();
    } else if(group === "term") updateTermOutput(row); else updateYearOutput(row);
    persist();
  });

  document.addEventListener("click", function(e){
    var t = e.target;

    if(t.id === "term-add"){
      state.term.push(emptyTermRow());
      renderTermList();
      persist();
      return;
    }
    if(t.id === "year-add"){
      state.year.push(emptyYearRow());
      renderYearList();
      persist();
      return;
    }

    var act = t.getAttribute("data-act");
    if(act === "del-term"){
      var id1 = t.getAttribute("data-id");
      state.term = state.term.filter(function(r){ return r.id !== id1; });
      if(state.term.length === 0) state.term.push(emptyTermRow());
      renderTermList();
      persist();
      return;
    }
    if(act === "del-year"){
      var id2 = t.getAttribute("data-id");
      state.year = state.year.filter(function(r){ return r.id !== id2; });
      if(state.year.length === 0) state.year.push(emptyYearRow());
      renderYearList();
      persist();
      return;
    }

    var copyKey = t.getAttribute("data-copy");
    if(copyKey){
      var el = document.getElementById("text-" + copyKey);
      if(el){
        copyToClipboard(el.textContent, t);
      }
      return;
    }

    if(t.classList.contains("tab-btn")){
      var tab = t.getAttribute("data-tab");
      document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.toggle("active", b === t); });
      document.getElementById("panel-term").classList.toggle("active", tab === "term");
      document.getElementById("panel-year").classList.toggle("active", tab === "year");
      return;
    }

    if(t.id === "clear-all"){
      if(confirm("入力したすべてのデータを消去します。よろしいですか?")){
        state = { term: [emptyTermRow()], year: [emptyYearRow()] };
        renderAll();
        persist();
      }
      return;
    }
  });

  function copyToClipboard(text, btn){
    function done(ok){
      var original = btn.textContent;
      btn.textContent = ok ? "コピーしました" : "コピー失敗";
      btn.classList.toggle("copied", ok);
      setTimeout(function(){
        btn.textContent = original;
        btn.classList.remove("copied");
      }, 1400);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ fallbackCopy(text, done); });
    }else{
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, cb){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      cb(ok);
    }catch(e){
      cb(false);
    }
  }

  renderAll();
})();
</script>
</body>
</html>
